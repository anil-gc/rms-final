[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
